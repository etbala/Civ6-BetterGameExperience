[package]
name = "bgd-updater-linux"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Installe, met à jour, répare ou retire les proxys de BetterGameExperience sous Linux (Steam, Proton)"

# Paquet autonome, comme updater/ et proxy/ : il ne vise que Linux x64. Sa logique (release, install,
# lang) est copiée de updater/ ; seuls game, http, sys, ui et main changent.
[workspace]

[[bin]]
name = "BetterGameExperience"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# TLS rustls et certificats racine embarqués : rien ne dépend du magasin de certificats du système.
ureq = "3"

[profile.release]
opt-level = "s"
strip = true
